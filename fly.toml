app = "jordi-codes"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

# The SSH host key is persisted here so the key is shared across instances
# and users never see a host-key-changed warning after a deploy.
# Create the volume once with:
#   fly volumes create ssh_host_key --size 1 --region mad
[[mounts]]
  source = "ssh_host_key"
  destination = "/app/.ssh"

[[services]]
  protocol = "tcp"
  internal_port = 22
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 22
